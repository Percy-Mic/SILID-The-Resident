; SILID - engine configuration.
; The GameMode/GameState/PlayerState/PlayerController classes are set in C++
; (see ASILIDGameMode's constructor); this file only pins the project-wide
; default GameMode so both PIE and packaged builds resolve it.

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/SILID.SILIDGameMode
EditorStartupMap=/Game/SILID/Maps/LM_SILID_GroundFloor

GameDefaultMap=/Game/SILID/Maps/LM_SILID_GroundFloor
[/Script/Engine.RendererSettings]
; Darkness-first presentation: keep dynamic GI/shadows on for the flashlight
; beam and the power-on lighting transition (doc 10 — the darkness-floor law).
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False

[/Script/UnrealEd.EditorSettings]
; Batch-import dialogs ("Unable to Check Out From Revision Control") were
; blocking scripted GLB imports headless. Unattended + no prompts.
; (Also handled per-session via -unattended.)

[/Script/UnrealEd.SourceControlPreferences]
; Prevent per-asset checkout dialogs during scripted imports.
bDisableSourceControl=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Prefer DX11 on this project's current Intel HD 4600 target. The default
; DX12 launch crashes on this machine before the editor can open.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX11

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=83F536104E9CD62789DF2F8D0A5E29B2
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=


; Local Zen DDC autolaunch deadlocks the editor on this machine during the
; first texture build of an asset import (reproduced twice, 2026-11-02).
; The Hierarchical DDC graph falls through to the legacy file cache.
[Zen]
AutoLaunch=false
; The installed-build DDC graph marks the local cache DeleteOnly, so an editor
; running from the installed launcher build crashes with "no writable nodes".
; Re-declare the graph locally with a writable per-project cache node.
[InstalledDerivedDataBackendGraph]
Root=(Type=KeyLength, Length=120, Inner=AsyncPut)
AsyncPut=(Type=AsyncPut, Inner=Hierarchy)
Hierarchy=(Type=Hierarchical, Inner=Pak, Inner=CompressedPak, Inner=EnginePak, Inner=EnterprisePak, Inner=ZenLocal, Inner=Local, Inner=Shared)
Pak=(Type=ReadPak, Filename="%GAMEDIR%DerivedDataCache/DDC.ddp")
CompressedPak=(Type=ReadPak, Filename="%GAMEDIR%DerivedDataCache/Compressed.ddp", Compressed=true)
EnginePak=(Type=ReadPak, Filename=../../../Engine/DerivedDataCache/Compressed.ddp, Compressed=true)
EnterprisePak=(Type=ReadPak, Filename=../../../Enterprise/DerivedDataCache/Compressed.ddp, Compressed=true)
ZenLocal=(Type=Zen, ServerID=Local)
Local=(Type=FileSystem, UnusedFileAge=10, FoldersToClean=10, ConsiderSlowAt=70, Path="%ENGINEVERSIONAGNOSTICUSERDIR%DerivedDataCache", EnvPathOverride=UE-LocalDataCachePath, EditorOverrideSetting=LocalDerivedDataCache, CommandLineOverride=LocalDataCachePath)
Shared=(Type=FileSystem, UnusedFileAge=10, FoldersToClean=10, ConsiderSlowAt=70, Path=?EpicDDC, EnvPathOverride=UE-SharedDataCachePath, EditorOverrideSetting=SharedDerivedDataCache, CommandLineOverride=SharedDataCachePath)

; Drive build scripts from a client after the editor is fully started
; (startup-time -ExecutePythonScript deadlocks on the first GLB texture build).
[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
bRemoteExecution=True


; LOW-END RENDERING RECIPE — Intel HD 4600 target.
; This recipe used to sit in Config/DefaultScalability.ini under
; [/Script/Engine.RendererSettings], but renderer project settings are read
; from THIS file; the scalability hierarchy only applies its own
; [<Group>Quality@<Level>] sections. None of it ever reached the renderer (the
; session log carried no r.ForwardShading line), so PIE ran the full deferred
; renderer over the 3,477-actor mansion and hung the D3D11 device
; (DXGI_ERROR_DEVICE_HUNG, D3D11Util.cpp:155) mid-drive. Same values, now in
; the section that is actually applied.
; r.ForwardShading is deliberately left off: switching renderers rebuilds every
; global shader permutation, and this machine manages ~10 per 130 s while the
; deferred permutations are already in the DDC. The load cut comes from the
; shadow/GI/post lines below instead.
[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.DynamicGI=0
r.SSR=0
r.SubsurfaceScattering=0
r.GenerateMeshDistanceFields=0
r.DynamicShadows=0
r.ShadowQuality=0
r.Shadow.MaxResolution=512
r.Shadow.CSM.MaxCascades=1
r.LightShafts=0
r.VolumetricFog=0
r.AmbientOcclusionLevels=0
r.BloomQuality=0
r.EyeAdaptationQuality=0
r.DepthOfFieldQuality=0
r.MotionBlurQuality=0
r.TonemapperQuality=0
r.Upscale.Quality=1
r.DetailMode=0
r.ViewDistanceScale=0.4
r.MipMapLODBias=1
r.MaxAnisotropy=1
r.DefaultFeature.AntiAliasing=0
r.AntiAliasingMethod=0
r.DefaultFeature.AmbientOcclusion=False
r.DefaultFeature.Bloom=False
r.Lumen.HardwareRayTracing=0
r.Lumen.ScreenProbeGather=0
r.VirtualTextures=0
r.Nanite=0
r.ScreenPercentage=50
