; test the VRAM-pressure hypothesis from the Phase 2.3 GPUCrash investigation.
; Revert by deleting this line (original 1000 MB is the engine default, and a
; pre-change backup exists at DefaultEngine.pre-2.4.ini).
r.Streaming.PoolSize=200